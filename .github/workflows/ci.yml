name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build check
        run: |
          python -m compileall .

  unit-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -v

  sonarqube:
    needs: unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  trivy:
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  docker-build:
    needs: trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t github-actions-demo:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save github-actions-demo:${{ github.sha }} \
            -o github-actions-demo.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: github-actions-demo.tar
          retention-days: 1

  trivy-image:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i github-actions-demo.tar

      - name: Trivy Image Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: github-actions-demo:${{ github.sha }}
          format: json
          output: trivy-report.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Add Trivy results to GitHub Summary
        if: always()
        shell: bash
        run: |
          echo "## 🔐 Trivy Image Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f trivy-report.json ]; then
            echo "❌ Trivy report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r '
            [
              .Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
            ] as $vulns
            |
            if ($vulns | length) == 0 then
              "✅ No HIGH or CRITICAL vulnerabilities found."
            else
              "### ❌ Found \($vulns | length) HIGH/CRITICAL vulnerabilities\n\n" +
              "| Severity | CVE | Package | Installed | Fixed Version |\n" +
              "|---|---|---|---|---|\n" +
              (
                $vulns
                | map(
                    "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "Not available") |"
                  )
                | join("\n")
              )
            end
          ' trivy-report.json >> "$GITHUB_STEP_SUMMARY"

  push-ecr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: trivy-image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i github-actions-demo.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag \
            github-actions-demo:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/github-actions-demo:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/github-actions-demo:${{ github.sha }}
